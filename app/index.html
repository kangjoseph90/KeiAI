<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="/favicon.png" />
        <title>KeiAI</title>
        <style>
            html {
                background: #ffffff;
                color-scheme: light;
            }

            html.dark {
                background: oklch(0.165 0.005 285.823);
                color-scheme: dark;
            }

            @media (prefers-color-scheme: dark) {
                html:not(.light) {
                    background: oklch(0.165 0.005 285.823);
                    color-scheme: dark;
                }
            }
        </style>
        <script>
            try {
                const preference = localStorage.getItem('pref:theme');
                const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
                const dark = preference === 'dark' || (preference !== 'light' && systemDark);
                if (dark) document.documentElement.classList.add('dark');
                if (preference === 'light') document.documentElement.classList.add('light');
                document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
            } catch {}
        </script>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
