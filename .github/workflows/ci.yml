name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  app-check-test:
    name: App Check and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app

      - name: Svelte Check
        run: pnpm check
        working-directory: app

      - name: Run Tests
        run: pnpm test:run
        working-directory: app

  proxy-test:
    name: Proxy Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # We'll use the package-lock.json for caching since pnpm-lock.yaml doesn't exist yet
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install
        working-directory: proxy

      - name: Run Tests
        run: pnpm test
        working-directory: proxy
